name: Echo Tittyverse TAO DEX one-shot
on:
  push:
    branches:
      - feat/echo-tittyverse-research-20261101
    paths:
      - scripts/echoTittyverseDexProbe.ts
      - .github/workflows/echo-tittyverse-dex-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify TAO pool relationships with one DEX API request
        run: npx tsx scripts/echoTittyverseDexProbe.ts
