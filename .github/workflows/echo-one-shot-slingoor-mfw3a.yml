name: Echo one-shot Slingoor public transaction diagnostic
on:
  push:
    branches:
      - diag/echo-slingoor-mfw3a-20261031
permissions:
  contents: read
jobs:
  inspect-public-tx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Bounded read-only latest Slingoor signature head from public RPC
        run: npx tsx scripts/echoOneShotRecentSlingoorSignatures.ts
