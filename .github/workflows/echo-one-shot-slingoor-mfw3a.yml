name: Echo one-shot Slingoor public transaction diagnostic
on:
  push:
    branches:
      - diag/echo-slingoor-mfw3a-20261031
permissions:
  contents: read
jobs:
  inspect-public-tx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify user-supplied Slingoor transaction via read-only public RPC
        env:
          ECHO_REPLAY_SIGNATURE: 5BW5sKmZRmYtrDPp4aGmgCR566TGxyL7NMzdAJQQ3E1nAs5KGVWpv9P9hfmNmQa6dJKNqLVMsfUMAi3ge7tGn1UL
        run: npx tsx scripts/echoInspectSampleTx.ts
