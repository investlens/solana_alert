name: Security Hotfix Validation
on:
  push:
    branches:
      - hotfix/fail-closed-liquidity-20260913
jobs:
  security-hotfix:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-only-placeholder
      TELEGRAM_BOT_TOKEN: test-only-placeholder
      OWNER_CHAT_ID: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Positive alert security policy tests
        run: npx tsx --test tests/positiveAlertSecurity.test.ts tests/alphaSemanticDelivery.test.ts
