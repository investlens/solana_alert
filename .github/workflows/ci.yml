name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [alphaos-v2-stability]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: test-token
      OWNER_CHAT_ID: "1"
      ADMIN_TELEGRAM_ID: "1"
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      ADMIN_TRADING_ENABLED: "false"
      AUTO_TRADE_MODE: paper
      PONS_SHADOW_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # One-off release gate for the Supply Journey draft, never a production poller.
      - name: Supply Journey live evidence comparison
        if: github.event.pull_request.number == 121
        env:
          SUPPLY_VALIDATION_RPC_URL: https://rpc.mainnet.chain.robinhood.com
          SUPPLY_VALIDATION_SECONDARY_RPC_URL: https://robinhood-mainnet-rpc.blockreq.com/v1/rpc/public
        run: node --import tsx scripts/validateSupplyJourneyLive.ts
