name: Echo independent two-BUY read-only replay
on:
  push:
    branches:
      - fix/echo-coverage-rpc-acceptance-20261031
  workflow_dispatch:
permissions:
  contents: read
jobs:
  onchain-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify Chairman and Slingoor confirmed BUYs (max 4 public RPC reads)
        run: npx tsx scripts/echoReplayTwoDeliveredBuys.ts
