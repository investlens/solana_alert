name: Echo reliability checks

on:
  workflow_dispatch:
    inputs:
      echo_isolated_test:
        description: "Run the isolated, no-broadcast real-RPC signer diagnostic"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - feat/echo-slingoor-livebuy-safety-20261027
      - feat/echo-paper-execution-safety-20261030
      - fix/echo-fresh-adaptive-budget-20261030
      - feat/echo-trade-readiness-guards-20261030
      - feat/echo-nonbroadcast-preview-20261030
      - feat/echo-callback-owner-simulation-20261030
      - fix/echo-unsigned-instruction-guard-20261030
      - fix/echo-durable-audit-outbox-20261030
      - feat/echo-supabase-audit-20261030
      - feat/echo-verified-market-card-20261030
      - fix/echo-fresh-window-boundary-20261030
      - fix/echo-alert-only-fresh-coverage-20261030
      - feat/echo-manual-readonly-audit-20261031
      - feat/echo-autobuy-readonly-integration-20261101
      - feat/echo-unsigned-route-audit-20261102
      - feat/echo-execution-economics-audit-20261102
      - feat/echo-pilot-total-budget-guard-20261102
      - feat/echo-five-usd-per-call-safety-20261106
  pull_request:
    branches:
      - feat/echo-admin-pilot-20261021

permissions:
  contents: read

jobs:
  echo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: test-token
      OWNER_CHAT_ID: '1'
      ADMIN_TELEGRAM_ID: '1'
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      ADMIN_TRADING_ENABLED: 'false'
      AUTO_TRADE_MODE: paper
      PONS_SHADOW_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Validate recovery script syntax (never connect to production)
        run: bash -n scripts/echoPrivateTableBackupAndLocalRestore.sh
      - name: Echo-focused tests
        run: npx tsx --test tests/echoPipelineIntegration.test.ts tests/echoResearchIntegration.test.ts tests/echoExecutionWallet.test.ts tests/echoPaperTradeEngine.test.ts tests/echoQueueCapacity.test.ts tests/echoFreshScan.test.ts tests/echoReservationPostgres.test.ts tests/echoSupabaseReservation.test.ts tests/echoPaperReservation.test.ts tests/echoSecureBuyGuard.test.ts tests/echoLandingBudget.test.ts tests/echoSlingoorReliability.test.ts tests/echoSubscriptionReliability.test.ts tests/echoBuyOnlyTransferRejection.test.ts tests/echoLogPrefilter.test.ts tests/echoJupiterRouteSignals.test.ts tests/echoPriorityQueue.test.ts tests/echoFallbackReliability.test.ts tests/echoFiveDollarCallPolicy.test.ts tests/echoFiveDollarCallStore.test.ts tests/echoPerCallNoBroadcastCoordinator.test.ts tests/echoLiveCallerPumpQuoteIngress.test.ts tests/echoIndependentCallerReceipt.test.ts tests/echoIntegratedPumpTradeAdmission.test.ts tests/echoSignerOwnedCanonicalPumpRoute.test.ts tests/echoSignerOwnedPumpFullSellPreview.test.ts tests/echoPerCallSignerAdmissionV2.test.ts tests/echoPumpUnsignedPerCallHandoff.test.ts tests/echoFiveDollarPumpInputSizing.test.ts tests/echoPumpPerCallSignerReview.test.ts tests/echoPumpSimulatedDebitEvidence.test.ts tests/echoPumpFundingReadiness.test.ts tests/echoSolUsdIndependentPrice.test.ts tests/echoPumpPerCallSignedDiscard.test.ts tests/echoSignerOwnedCompiledCpiSimulation.test.ts tests/echoSignerOwnedPumpRpcProbe.test.ts tests/echoSignerOwnedPumpPoolEvidence.test.ts tests/echoSignerOwnedPumpCpiAccounting.test.ts tests/echoSignerOwnedOfficialPumpQuote.test.ts tests/echoSignerNoBroadcastTestOnce.test.ts tests/echoPumpRawCpiInspection.test.ts tests/echoPhantomSellReserveReview.test.ts tests/echoSignerDebitEnvelope.test.ts tests/echoPortfolioExitReserveReview.test.ts tests/echoIntegratedNoBroadcastReleaseGate.test.ts tests/echoUnfundedStageOneReadiness.test.ts tests/echoTenDollarPilot.test.ts tests/echoManualSellAdmission.test.ts tests/echoAtomicPilotReservation.test.ts tests/echoSupabaseAtomicPilotStore.test.ts tests/echoIsolatedSignerContract.test.ts tests/echoIsolatedTransactionTransport.test.ts tests/echoSharedTradeExecution.test.ts tests/echoUnknownSubmissionRecovery.test.ts tests/echoReconcileTradeFromChain.test.ts tests/echoWalletOwnershipProof.test.ts tests/echoPilotSqlMigration.test.ts tests/echoAuthenticatedSignerRequest.test.ts tests/echoPhantomLocalVerifier.test.ts tests/echoIsolatedCustodyProbe.test.ts tests/echoLocalIsolatedTradeModel.test.ts tests/echoReadOnlyJupiterV2Swap.test.ts tests/echoUnsignedSwapAudit.test.ts tests/echoTrustedReservationPreview.test.ts tests/echoReadOnlyPumpLocalPreview.test.ts tests/echoSupabaseTrustedReservationReader.test.ts tests/echoReadOnlySignerAdmission.test.ts tests/echoSignerNonceJournal.test.ts tests/echoSignerNonceSqlSecurity.test.ts tests/echoSupabaseNonceStore.test.ts tests/echoReadOnlySimulationClassification.test.ts tests/echoReadOnlyAddressLookupInspection.test.ts tests/echoReadOnlyTransactionAccountAudit.test.ts tests/echoResolvedUnsignedBuyAudit.test.ts tests/echoRoundTripEconomicAudit.test.ts tests/echoObservedRoundTripReceipts.test.ts tests/echoProgramProvenanceResearch.test.ts tests/echoFastFollowerPriceGate.test.ts tests/echoFastFollowerShadowAdmission.test.ts tests/echoAutoBuyReadOnlyTrial.test.ts tests/echoAutoBuyDurableRestart.test.ts tests/echoAutoBuyShadowGate.test.ts tests/echoLandingFeeShadow.test.ts tests/echoRecentPriorityFeeReadOnly.test.ts tests/echoFastFollowerLatencyEvidence.test.ts tests/echoVerifiedBuyLatencyTracker.test.ts tests/echoVerifiedBuyTelemetryWiring.test.ts tests/echoPilotTotalBudgetGuard.test.ts tests/echoPilotRoundTripPreview.test.ts tests/echoPilotReadOnlyCoordinator.test.ts tests/echoPilotAllInSql.test.ts tests/echoAllInPilotReservation.test.ts tests/echoManualSellReadOnlyCallback.test.ts tests/echoConfiguredCustodyProof.test.ts tests/echoPilotBuyFirstPreview.test.ts tests/echoPilotBuyFirstCoordinator.test.ts tests/echoOfficialPumpRouteAdmission.test.ts tests/echoOfficialPumpTwoHopQuoteGate.test.ts tests/echoCallerAmountIndependence.test.ts tests/echoTrustedWalletCapitalReadOnly.test.ts tests/echoCheckLegacyWalletBinding.test.ts tests/echoPilotOneShotSql.test.ts tests/echoSupabaseOneShotBuyClaim.test.ts tests/echoOfflineSignedBuyDryRun.test.ts tests/echoIsolatedSealedCustodyProof.test.ts tests/echoSignedMessageAttestation.test.ts tests/echoOneShotBuyHandoff.test.ts tests/echoManualWalletAppExitVerifier.test.ts
      - name: Historical Slingoor read-only classifier replay
        env:
          ECHO_REPLAY_SIGNATURE: '5W5d2xZT8K2QTmpixHviNrt5E38esAhqmjNVfqxmfm4Jz8RoEfwsW6efsEJ6ptxT1tj5sxeGFj8UicopFP5TT3Ed'
          ECHO_REPLAY_UNAVAILABLE_NONBLOCKING: 'true'
        run: npx tsx scripts/echoInspectSampleTx.ts
      - name: All repository tests
        run: npm test

  echo-real-read-only-probe:
    # One explicitly marked commit only. Never runs on ordinary pushes/PRs.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[echo-mainnet-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ECHO_PREVIEW_WALLET: '8ndw7DJ6hyZBm1PD3JJMF8G4PD5CJhDCCUK13ECL2pgQ'
      ECHO_PREVIEW_MINT: 'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v'
      ECHO_PREVIEW_RPC_URL: 'https://api.mainnet-beta.solana.com'
      ADMIN_TRADING_ENABLED: 'false'
      AUTO_TRADE_MODE: paper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Mainnet Jupiter read-only BUY diagnostics
        env:
          ECHO_PREVIEW_SIDE: BUY
          ECHO_PREVIEW_AMOUNT_RAW: '10000000'
        shell: bash
        run: |
          set +e
          npx tsx scripts/echoRealReadOnlySwapV2.ts
          echo "BUY read-only diagnostic completed (failure means NOT VERIFIED, never a broadcast)"
          exit 0
      - name: Mainnet Jupiter read-only SELL diagnostics
        env:
          ECHO_PREVIEW_SIDE: SELL
          ECHO_PREVIEW_AMOUNT_RAW: '10000'
        shell: bash
        run: |
          set +e
          npx tsx scripts/echoRealReadOnlySwapV2.ts
          echo "SELL read-only diagnostic completed (failure means NOT VERIFIED, never a broadcast)"
          exit 0

  echo-pump-mainnet-read-only:
    # Explicit single-use trigger only. No secrets; no broadcaster methods.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[echo-pump-mainnet-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ADMIN_TRADING_ENABLED: 'false'
      AUTO_TRADE_MODE: paper
      ECHO_PREVIEW_WALLET: '8ndw7DJ6hyZBm1PD3JJMF8G4PD5CJhDCCUK13ECL2pgQ'
      ECHO_PREVIEW_MINT: 'D4AnTZk3spQgCEMpC4iqtFp8U2qbiDvzrzdaq7Dopump'
      ECHO_PREVIEW_RPC_URL: 'https://api.mainnet-beta.solana.com'
      ECHO_PREVIEW_AMOUNT_SOL: '0.025'
      ECHO_PREVIEW_POOL: pump-amm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: One unsigned PumpPortal build + one Solana simulate RPC, never submit
        run: npx tsx scripts/echoPumpMainnetReadOnlyProbe.ts

  echo-chain-state-read-only:
    # One explicit operator-initiated commit only. No secrets and no trading.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[echo-chain-state-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    env:
      ADMIN_TRADING_ENABLED: 'false'
      AUTO_TRADE_MODE: paper
      ECHO_PREVIEW_WALLET: '8ndw7DJ6hyZBm1PD3JJMF8G4PD5CJhDCCUK13ECL2pgQ'
      ECHO_PREVIEW_MINT: 'D4AnTZk3spQgCEMpC4iqtFp8U2qbiDvzrzdaq7Dopump'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Exactly two public mainnet account-state RPC reads, no trades
        run: npx tsx scripts/echoMainnetPublicStateProbe.ts

  echo-resolved-route-mainnet:
    # One explicit commit only, strict public RPC read limit, zero execution.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[echo-route-mainnet-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ADMIN_TRADING_ENABLED: 'false'
      AUTO_TRADE_MODE: paper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Max one unsigned builder and two account-state RPC reads
        run: npx tsx scripts/echoResolvedRouteMainnetProbe.ts

  echo-unreviewed-program-provenance:
    # One-shot explicitly tagged commit, public account metadata only.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[echo-program-provenance-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ADMIN_TRADING_ENABLED: 'false'
      AUTO_TRADE_MODE: paper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: "Two public RPC reads: program and program-data, never sign"
        run: npx tsx scripts/echoThirdPartyProgramReadOnlyProbe.ts

  echo-official-pumpswap-unsigned:
    # One operator-triggered SDK-only proof. Never signs or broadcasts.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[echo-official-pump-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ADMIN_TRADING_ENABLED: 'false'
      AUTO_TRADE_MODE: paper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned official SDK in one-shot probe only, not production
        run: npm install --no-save --ignore-scripts --no-package-lock @pump-fun/pump-sdk@4.3.1
      - name: Read verified PumpSwap pool, compile unsigned 0.025 SOL, simulate only if funded
        run: npx tsx scripts/echoOfficialPumpSwapUnsignedProbe.ts

  echo-official-intermediate-hop:
    # On-demand only; public Solana state with a strict RPC request cap.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[echo-first-hop-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ADMIN_TRADING_ENABLED: 'false'
      AUTO_TRADE_MODE: paper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts --no-package-lock @pump-fun/pump-sdk@4.3.1
      - name: One-shot official SDK intermediate pool or curve discovery
        run: npx tsx scripts/echoOfficialFirstHopReadOnlyProbe.ts

  echo-official-two-hop-build:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[echo-two-hop-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ADMIN_TRADING_ENABLED: 'false'
      AUTO_TRADE_MODE: paper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts --no-package-lock @pump-fun/pump-sdk@4.3.1
      - name: Build official unsigned two-hop message without economic authorization
        run: npx tsx scripts/echoOfficialTwoHopBuildOnly.ts

  echo-official-sdk-quote-surface:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[echo-quote-surface]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts --no-package-lock @pump-fun/pump-sdk@4.3.1
      - run: npx tsx scripts/echoOfficialQuoteCapabilities.ts

  echo-official-two-hop-quote-sim:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[echo-two-hop-quote-sim]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ADMIN_TRADING_ENABLED: 'false'
      AUTO_TRADE_MODE: paper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts --no-package-lock @pump-fun/pump-sdk@4.3.1
      - name: Fee-aware official quote, non-broadcast build and one bounded unsigned simulateTransaction
        run: npx tsx scripts/echoOfficialTwoHopQuoteSimulate.ts

  echo-disposable-postgres:
    # Explicit single-use zero-funding integration proof, on a GitHub runner.
    # This Docker database is NOT Supabase; no live app secrets are provided.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[echo-postgres-integration]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Four real Postgres clients, one-shot claim, nonce and hard restart
        run: bash scripts/echoDisposablePostgresPilotIntegration.sh

  echo-five-dollar-postgres:
    # Fully isolated disposable PostgreSQL 17 test; never touches Supabase.
    if: github.event_name == 'push' && github.ref_name == 'feat/echo-five-usd-per-call-safety-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      ADMIN_TRADING_ENABLED: 'false'
      AUTO_TRADE_MODE: paper
    steps:
      - uses: actions/checkout@v4
      - name: Atomic per-call SQL, duplicate replay, $5 ceiling and no-broadcast
        run: bash scripts/echoFiveDollarDisposablePostgres.sh

  echo-isolated-signer-real-rpc:
    # An explicit one-shot commit marker only. Disposable GitHub runner, NOT
    # a Railway service or key-bearing isolated signer. All requests read-only.
    if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[echo-isolated-test]')) || (github.event_name == 'workflow_dispatch' && inputs.echo_isolated_test == true && github.ref_name == 'feat/echo-five-usd-per-call-safety-20261106')
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    env:
      ADMIN_TRADING_ENABLED: 'false'
      AUTO_TRADE_MODE: paper
      ECHO_SIGNER_MODE: PROOF_ONLY
      ECHO_SIGNER_BROADCAST_ENABLED: 'false'
      ECHO_SIGNER_REQUESTS_ENABLED: 'false'
      ECHO_EXPORT_UNSIGNED_FOR_SIGNER_TEST: 'true'
      ECHO_SCENARIO_USE_PUBLIC_FX: 'true'
      # Never treated as CPI proof: this is only a provisional estimate.
      ECHO_SCENARIO_CPI_ALLOWANCE_LAMPORTS: '1000000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Package official SDK in disposable runner only
        run: npm install --no-save --ignore-scripts --no-package-lock @pump-fun/pump-sdk@4.3.1 bn.js@5.2.2
      - name: Enforce exact direct SDK and BN versions in isolated runner
        run: |
          node -e "const p=require('./node_modules/@pump-fun/pump-sdk/package.json');if(p.version!=='4.3.1')process.exit(1)"
          node -e "const b=require('./node_modules/bn.js/package.json');if(b.version!=='5.2.2')process.exit(1)"
      - name: Derive exact official PumpSwap unsigned transaction from real chain state
        shell: bash
        run: |
          set +e
          npx tsx scripts/echoOfficialFiveUsdScenarioQuote.ts
          diagnostic_status=$?
          if [ ! -s .echo-isolated-unsigned-payload.json ]; then
            echo "OFFICIAL_UNSIGNED_MESSAGE_NOT_CONSTRUCTED; scenario status=${diagnostic_status}"
            exit 1
          fi
          echo "EXACT_UNSIGNED_SDK_SCENARIO_GENERATED=YES; simulation may be blocked by unfunded wallet"
      - name: Execute isolated test-only signer RPC diagnostic (never sign or send)
        run: npx tsx scripts/echoRunSignerDiagnosticFromSdkScenario.ts
      - name: Remove exact unsigned scenario payload from ephemeral runner
        if: always()
        run: rm -f .echo-isolated-unsigned-payload.json

  echo-five-usd-mainnet-scenario:
    # Only run from an explicitly tagged push, no keys, no real funds.
    # $200/SOL is an ILLUSTRATIVE OPERATOR INPUT, not a verified live FX.
    # CPI allowance is an assumption; output MUST remain non-executable.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[echo-five-usd-scenario-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ADMIN_TRADING_ENABLED: 'false'
      AUTO_TRADE_MODE: paper
      # Public Coinbase/Kraken consensus overrides illustrative fallback;
      # exchange tick age and CPI remain unverified; no signing or broadcasting.
      ECHO_SCENARIO_USE_PUBLIC_FX: 'true'
      ECHO_SCENARIO_SOL_USD_CENTS: '20000'
      ECHO_SCENARIO_CPI_ALLOWANCE_LAMPORTS: '1000000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts --no-package-lock @pump-fun/pump-sdk@4.3.1
      - name: One quote and unsigned fee-adjusted $5 scenario, never sign
        run: npx tsx scripts/echoOfficialFiveUsdScenarioQuote.ts

  echo-sol-fx-public-read-only:
    # Explicit one-shot public FX check only. No wallet, key or trade capability.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[echo-sol-fx-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      ADMIN_TRADING_ENABLED: 'false'
      AUTO_TRADE_MODE: paper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cross-check two independent public SOL/USD market quotes (no execution)
        run: npx tsx scripts/echoSolUsdPublicPriceDiagnostic.ts
