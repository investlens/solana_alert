name: Chairman BUY incident diagnostic
on:
  push:
    branches:
      - diagnostic/chairman-buy-20261030
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Read-only Chairman incident probe (public RPC only)
        run: npx tsx scripts/echoInspectChairmanBuy.ts
